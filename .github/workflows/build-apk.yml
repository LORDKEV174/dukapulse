name: Build DukaPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          PKG_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "APP_DIR=$PKG_DIR" >> $GITHUB_ENV
          cd "$PKG_DIR"
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor & Add Android
        run: |
          cd "$APP_DIR"
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DukaPulse" "com.dukapulse.app" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload DukaPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: DukaPulse-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
